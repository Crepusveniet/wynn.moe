{{ define "main" }}
{{ partial "pane-open.html" (dict "name" "archives" "page" .) }}
<h1 class="sr-only">{{ .Title }}</h1>
{{ range (where site.RegularPages "Section" "blog").GroupByDate "2006" }}
<section class="archive-year"><h2>{{ .Key }}</h2>{{ partial "entries.html" .Pages }}</section>
{{ end }}
{{ partial "pane-close.html" . }}
{{ end }}
